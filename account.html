<!DOCTYPE html>
<html lang="en">
<head>

  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My account — RecycleHelper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Gasoek+One&family=Inter:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mansstils.css">
  <link rel="stylesheet" href="css/transitions.css">

<body>

  <nav>
    <a href="index.html" class="nav-link">Home</a>
    <a href="aboutus.html" class="nav-link">About us</a>

      <p id="account-email"></p>
