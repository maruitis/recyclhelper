<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecycleHelper - Your Impact</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:wght@400;700&family=Gasoek+One&family=Inter:wght@400;700&family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Gasoek+One&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Gasoek+One&family=Jomhuria&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Gasoek+One&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jomhuria&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Gasoek+One&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jomhuria&family=Lalezar&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Gasoek+One&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jaldi:wght@400;700&family=Jomhuria&family=Lalezar&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Gasoek+One&display=swap" rel="stylesheet">

    <link href="css/mansstils.css" rel="stylesheet" type="text/css"/>
    <link rel="stylesheet" href="css/transitions.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script>(function(){var t=localStorage.getItem('recycle_theme');if(t==='dark'||t==='sky')document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-link">Home</a>
        <a href="aboutus.html" class="nav-link">About us</a>
        <a href="ourmission.html" class="nav-link">Our mission</a>
        <a href="donate.html" class="nav-link">Donate</a>
    </nav>

    <div class="cloud cloud-left"><img src="images/cloud.png" alt="cloud"></div>
    <div class="cloud cloud-right"><img src="images/cloud.png" alt="cloud"></div>

    <header class="recycle-header">
        <h4>RECYCLEHELPER</h4>
        <div class="search-stack">
            <div class="search-row search-row-small">
                <form id="searchForm" class="search-container small">
                    <input type="text" id="searchInput" placeholder="Search another item..." required>
                    <button type="submit">🔍</button>
                </form>
                <button type="button" class="scan-item-btn scan-item-btn-small" id="scanBtn">📷 Scan</button>
            </div>
            <div id="filterTags"></div>
        </div>
    </header>

    <div class="recycle-layout">

        <!-- FAR LEFT: item image -->
        <div class="recycle-img-col">
            <img id="itemImage" src="images/placeholder.png">
        </div>

        <!-- RIGHT: lifehacks on top, calc+map on bottom -->
        <div class="recycle-content-col">

            <!-- Lifehacks -->
            <section class="lifehack-section">
                <h5 class="lifehack-header">Lifehacks and Homemade Ideas</h5>
                <div class="lifehack-cards">
                    <div class="lifehack-card" id="diy-0"></div>
                    <div class="lifehack-card" id="diy-1"></div>
                    <div class="lifehack-card" id="diy-2"></div>
                </div>
            </section>

            <!-- Calculator + Map -->
            <div class="calc-map-row">
                <div class="glass-panel calculator">
                    <div class="calc-top-row">
                        <h3 class="calc-heading">Efficiency<br>calculator</h3>
                        <div class="calc-qty-pill">
                            <span class="calc-qty-label">Amount:</span>
                            <button class="calc-qty-btn" id="calcQtyMinus">−</button>
                            <span class="calc-qty-num" id="calcQtyDisplay">1</span>
                            <button class="calc-qty-btn" id="calcQtyPlus">+</button>
                        </div>
                    </div>
                    <p class="calc-saved-word">Saved</p>
                    <div class="results-display">
                        <div class="stat-item">
                            <div class="stat-text">
                                <span class="stat-label">water</span>
                                <span class="stat-colon"> :</span>
                                <span class="stat-value"><span id="saveWater">0</span> l</span>
                            </div>
                            <img src="images/water 3d.png" alt="water" class="calc-img">
                        </div>
                        <div class="stat-item">
                            <div class="stat-text">
                                <span class="stat-label">energy</span>
                                <span class="stat-colon"> :</span>
                                <span class="stat-value"><span id="saveEnergy">0</span> kWh</span>
                            </div>
                            <img src="images/energy.png" alt="energy" class="calc-img">
                        </div>
                        <div class="stat-item">
                            <div class="stat-text">
                                <span class="stat-label">CO2</span>
                                <span class="stat-colon"> :</span>
                                <span class="stat-value"><span id="saveCO2">0</span> g</span>
                            </div>
                            <img src="images/co2.png" alt="co2" class="calc-img">
                        </div>
                    </div>
                </div>

                <div class="map-section">
                    <h3 class="map-heading" id="mapHeading">Find the closest deposit points</h3>
                    <div class="map-wrapper" id="mapWrapper">
                        <div id="map"></div>
                        <div class="map-overlay" id="mapOverlay">
                            <input type="text" id="addressInput" placeholder="Enter your address..." autocomplete="off">
                            <button class="map-find-btn" onclick="findCenters()">🔍</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <h2> EVERY RECYCLED ITEM MAKES A DIFFERENCE! ACT NOW!</h2>
    <script src="js/main.js"></script>
    <script src="js/search.js"></script>
    <script src="js/recycle.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/language.js"></script>
    <script src="js/transitions.js"></script>
</body>
</html>
