<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — RecycleHelper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Gasoek+One&family=Inter:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mansstils.css">
  <link rel="stylesheet" href="css/transitions.css">
  <script>(function(){var t=localStorage.getItem('recycle_theme');if(t==='dark'||t==='sky')document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>

  <div class="cloud cloud-left" aria-hidden="true"><img src="images/cloud.png" alt=""></div>
  <div class="cloud cloud-right" aria-hidden="true"><img src="images/cloud.png" alt=""></div>

  <h1 style="text-align:center;margin-top:24px;">RECYCLEHELPER.COM</h1>

  <div id="auth-box">
    <h2 id="form-title">Login</h2>

    <input type="email" id="email" placeholder="Your email" autocomplete="email" />
    <input type="password" id="password" placeholder="Your password" autocomplete="current-password" />

    <button type="button" id="btn-login" onclick="login()">Login</button>
    <button type="button" id="btn-register" onclick="register()" style="display:none;">Register</button>

    <p id="message"></p>

    <p style="text-align:center;margin-top:14px;">
      <a href="#" id="toggle-link" onclick="return toggleForm();">New here? Create an account</a>
    </p>
  </div>

  <script src="js/theme.js"></script>
</body>
</html>
