    <h1>RECYCLEHELPER.COM</h1>
<!-- Inside your index.html body -->
<div class="search-row">
    <button class="ecobot-trigger" id="ecoBotTrigger" aria-label="Ask EcoBot">
        <img src="images/ecochat.png" alt="EcoBot" class="ecobot-trigger-img">
    </button>
    <form id="searchForm" class="search-container">
        <input type="text" id="searchInput" placeholder="Search (e.g. plastic bottle, book etc.)" required>
        <button type="submit"><img src="images/search.png" alt="Search" class="search-btn-img"></button>
    </form>
    <button type="button" class="scan-item-btn" id="scanBtn">
        <img src="images/scanner.png" alt="Scan" class="scan-btn-img">
        <span>Scan!</span>
    </button>
</div>

<!-- Eco Bot panel -->
<div class="ecobot-panel" id="ecoBotPanel" aria-hidden="true">
    <div class="ecobot-header">
        <div>
            <div class="ecobot-name">EcoBot</div>
            <div class="ecobot-sub">Your recycling guide</div>
        </div>
        <button class="ecobot-close" id="ecoBotClose" aria-label="Close"><span class="ecobot-close-x">✕</span></button>
    </div>
    <div class="ecobot-messages" id="ecoBotMessages">
        <div class="ecobot-msg ecobot-msg-bot">
            Hi! I'm EcoBot 🌱 Pick a topic or type a keyword to find answers.
        </div>
    </div>
    <div class="ecobot-categories" id="ecoBotCategories"></div>
    <div class="ecobot-input-row">
        <input class="ecobot-input" id="ecoBotInput" placeholder="Search questions…" autocomplete="off">
        <button class="ecobot-send" id="ecoBotSend">↑</button>
    </div>
</div>
